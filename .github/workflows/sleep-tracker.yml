name: Sleep Tracker

on:
  schedule:
    - cron: '15 21 * * *'  # Ogni giorno alle 21:15 UTC (23:15 CET)
  workflow_dispatch:  # Permette di eseguire manualmente

jobs:
  update-sleep-data:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      - run: cat sleep_tracker.py | head -80
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install google-auth google-api-python-client gspread
      
      - name: Create credentials file
        run: |
          echo '${{ secrets.SLEEP_TRACKER_CREDENTIALS }}' > sleep-tracker-credentials.json
      
      - name: Run sleep tracker
        run: |
          python sleep_tracker.py
